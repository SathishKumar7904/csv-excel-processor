name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl --fail http://localhost:9000/api/system/status || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
          SONAR_WEB_JAVAOPTS: -Xmx512m
          SONAR_CE_JAVAOPTS: -Xmx512m
          SONAR_SEARCH_JAVAOPTS: -Xmx512m
    env:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_ADMIN_PASSWORD: ${{ secrets.SONAR_ADMIN_PASSWORD || 'TrainingAdmin123' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for SonarQube
        run: |
          echo "Waiting for SonarQube at ${SONAR_HOST_URL}..."
          for i in $(seq 1 90); do
            status=$(curl -sf "${SONAR_HOST_URL}/api/system/status" | jq -r '.status // empty' || true)
            echo "attempt=${i} status=${status:-DOWN}"
            if [ "${status}" = "UP" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube did not become ready in time"
          exit 1

      - name: Bootstrap SonarQube auth and failing quality gate
        run: |
          set -euo pipefail

          auth_ok() {
            curl -sf -u "$1" "${SONAR_HOST_URL}/api/authentication/validate" \
              | jq -e '.valid == true' >/dev/null
          }

          # First login on Community images requires changing admin/admin.
          curl -sS -o /tmp/sonar-change-password.json -w "%{http_code}" -u admin:admin -X POST \
            "${SONAR_HOST_URL}/api/users/change_password" \
            --data-urlencode "login=admin" \
            --data-urlencode "previousPassword=admin" \
            --data-urlencode "password=${SONAR_ADMIN_PASSWORD}" \
            >/tmp/sonar-change-password.status || true
          echo "change_password http=$(cat /tmp/sonar-change-password.status)"

          if auth_ok "admin:${SONAR_ADMIN_PASSWORD}"; then
            SONAR_PASSWORD="${SONAR_ADMIN_PASSWORD}"
          elif auth_ok "admin:admin"; then
            SONAR_PASSWORD="admin"
          else
            echo "Could not authenticate to SonarQube as admin"
            exit 1
          fi
          SONAR_AUTH="admin:${SONAR_PASSWORD}"

          TOKEN_JSON=$(curl -sf -u "${SONAR_AUTH}" -X POST \
            "${SONAR_HOST_URL}/api/user_tokens/generate" \
            --data-urlencode "name=github-actions-${GITHUB_RUN_ID}")
          SONAR_LOGIN=$(echo "${TOKEN_JSON}" | jq -r '.token // empty')
          if [ -z "${SONAR_LOGIN}" ]; then
            echo "Token generation failed; using admin login/password"
            SONAR_LOGIN="admin"
            echo "SONAR_PASSWORD=${SONAR_PASSWORD}" >> "${GITHUB_ENV}"
          else
            echo "::add-mask::${SONAR_LOGIN}"
            SONAR_PASSWORD=""
            echo "SONAR_PASSWORD=" >> "${GITHUB_ENV}"
          fi

          echo "SONAR_LOGIN=${SONAR_LOGIN}" >> "${GITHUB_ENV}"
          echo "SONAR_AUTH=${SONAR_AUTH}" >> "${GITHUB_ENV}"

          curl -sf -u "${SONAR_AUTH}" -X POST \
            "${SONAR_HOST_URL}/api/qualitygates/create" \
            --data-urlencode "name=workshop-fail" || true

          create_condition() {
            curl -sf -u "${SONAR_AUTH}" -X POST \
              "${SONAR_HOST_URL}/api/qualitygates/create_condition" \
              --data-urlencode "gateName=workshop-fail" \
              --data-urlencode "metric=${1}" \
              --data-urlencode "op=${2}" \
              --data-urlencode "error=${3}" || true
          }
          create_condition bugs GT 0
          create_condition vulnerabilities GT 0
          create_condition code_smells GT 0
          create_condition coverage LT 80

          curl -sf -u "${SONAR_AUTH}" -X POST \
            "${SONAR_HOST_URL}/api/qualitygates/set_as_default" \
            --data-urlencode "name=workshop-fail" || true

      - name: Run tests, coverage, and Sonar analysis
        id: scan
        continue-on-error: true
        run: |
          chmod +x mvnw
          # sonar-maven-plugin 4.0.x reads credentials from sonar.login
          # (a user token, or admin + sonar.password). sonar.token is ignored.
          MVN_SONAR_ARGS=(
            -Dsonar.host.url="${SONAR_HOST_URL}"
            -Dsonar.login="${SONAR_LOGIN}"
            -Dsonar.projectKey=csv-excel-processor
            -Dsonar.projectName="CSV to Excel Processor (Coding Standards Demo)"
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
          )
          if [ -n "${SONAR_PASSWORD:-}" ]; then
            MVN_SONAR_ARGS+=(-Dsonar.password="${SONAR_PASSWORD}")
          fi
          ./mvnw -B verify sonar:sonar "${MVN_SONAR_ARGS[@]}"

      - name: Export SonarQube report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p sonar-report
          AUTH="${SONAR_AUTH:-admin:${SONAR_ADMIN_PASSWORD}}"
          PROJECT_KEY=csv-excel-processor

          curl -sf -u "${AUTH}" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" \
            > sonar-report/quality-gate.json

          curl -sf -u "${AUTH}" \
            "${SONAR_HOST_URL}/api/measures/component?component=${PROJECT_KEY}&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc,security_hotspots,sqale_index,reliability_rating,security_rating,sqale_rating" \
            > sonar-report/measures.json

          curl -sf -u "${AUTH}" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&ps=500&additionalFields=rules" \
            > sonar-report/issues.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("sonar-report")
          qg = json.loads((report / "quality-gate.json").read_text(encoding="utf-8"))
          measures_raw = json.loads((report / "measures.json").read_text(encoding="utf-8"))
          issues_raw = json.loads((report / "issues.json").read_text(encoding="utf-8"))

          status = qg.get("projectStatus", {}).get("status", "UNKNOWN")
          conditions = qg.get("projectStatus", {}).get("conditions", [])
          measures = {
              m.get("metric"): m.get("value", "")
              for m in measures_raw.get("component", {}).get("measures", [])
          }
          issues = issues_raw.get("issues", [])

          lines = [
              "# SonarQube quality gate report",
              "",
              f"**Project:** csv-excel-processor",
              f"**Status:** {status}",
              "",
              "The dashboard URL in the Maven log (`http://localhost:9000/...`) is only reachable on the GitHub Actions runner. Download this artifact instead.",
              "",
              "## Measures",
              "",
              "| Metric | Value |",
              "| --- | --- |",
          ]
          for key in [
              "bugs",
              "vulnerabilities",
              "security_hotspots",
              "code_smells",
              "coverage",
              "duplicated_lines_density",
              "ncloc",
          ]:
              lines.append(f"| {key} | {measures.get(key, 'n/a')} |")

          lines += ["", "## Quality gate conditions", "", "| Metric | Operator | Error threshold | Actual | Status |", "| --- | --- | --- | --- | --- |"]
          for c in conditions:
              lines.append(
                  f"| {c.get('metric')} | {c.get('comparator')} | {c.get('errorThreshold')} | {c.get('actualValue')} | {c.get('status')} |"
              )

          lines += ["", f"## Issues ({len(issues)})", "", "| Severity | Type | File | Line | Message |", "| --- | --- | --- | --- | --- |"]
          for issue in issues:
              component = issue.get("component", "").split(":", 1)[-1]
              line = issue.get("line", "")
              message = str(issue.get("message", "")).replace("|", "\\|").replace("\n", " ")
              lines.append(
                  f"| {issue.get('severity', '')} | {issue.get('type', '')} | {component} | {line} | {message} |"
              )

          (report / "quality-gate-report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          echo "Report written to sonar-report/"

      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-quality-gate-report
          path: sonar-report/
          if-no-files-found: warn

      - name: Fail job because quality gate did not pass
        if: steps.scan.outcome == 'failure'
        run: |
          echo "QUALITY GATE STATUS: FAILED"
          echo "Download the sonar-quality-gate-report artifact from this workflow run."
          echo "localhost:9000 is only available on the GitHub Actions runner."
          exit 1
